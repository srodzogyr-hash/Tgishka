<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Дурак Онлайн — Tgishka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/durak.css?v=2">
</head>
<body>
    <div id="game-app">
        <!-- HEADER / TOP BAR -->
        <header class="top-bar">
            <div class="room-info">
                <span class="room-badge">Комната: <b id="lbl-room-id">...</b></span>
                <span class="state-badge" id="lbl-game-state">Ожидание</span>
            </div>
            <div class="top-actions">
                <button id="btn-sound" class="icon-btn" title="Звук">🔊</button>
                <button id="btn-chat-toggle" class="icon-btn" title="Чат стола">💬 <span id="chat-badge" class="badge"></span></button>
                <button id="btn-settings" class="icon-btn" title="Настройки ИИ">⚙️</button>
            </div>
        </header>

        <!-- GAME TABLE AREA -->
        <main class="table-container">
            <div class="felt-table">
                <!-- OPPONENTS SEATS (AROUND TOP & SIDES) -->
                <div id="opponents-layer" class="opponents-layer"></div>

                <!-- TABLE CENTER: ATTACK / DEFENSE BOUT -->
                <div class="table-center">
                    <div id="bout-slots" class="bout-slots">
                        <!-- 6 Card Slots -->
                    </div>
                </div>

                <!-- DECK & TRUMP (UPPER LEFT) -->
                <div class="deck-zone">
                    <div class="trump-card-wrapper" id="trump-card-wrapper">
                        <img id="img-trump-card" src="/static/cards/RED_BACK.svg" alt="Козырь" class="trump-card">
                    </div>
                    <div class="deck-card-wrapper" id="deck-card-wrapper">
                        <img id="img-deck-top" src="/static/cards/RED_BACK.svg" alt="Колода" class="deck-card">
                        <div id="deck-badge" class="deck-counter">36</div>
                    </div>
                    <div id="trump-suit-indicator" class="trump-suit-label"></div>
                </div>

                <!-- DISCARD PILE (БИТО, UPPER RIGHT) -->
                <div class="discard-zone" id="discard-zone">
                    <div class="discard-card-wrapper">
                        <img src="/static/cards/RED_BACK.svg" alt="Бито" class="discard-card">
                        <div id="discard-badge" class="discard-counter">0</div>
                    </div>
                    <div class="discard-label">БИТО</div>
                </div>

                <!-- ANNOUNCEMENT BANNER (ROUND WINNER, WHO TOOK, ETC.) -->
                <div id="announcement-banner" class="announcement-banner hidden"></div>
            </div>
        </main>

        <!-- BOTTOM AREA: PLAYER CONTROLS & HAND -->
        <footer class="player-zone">
            <!-- ACTION BUTTONS -->
            <div class="action-bar">
                <button id="btn-pass" class="btn-action btn-bito hidden">БИТО ✋</button>
                <button id="btn-take" class="btn-action btn-beru hidden">БЕРУ 📥</button>
                <button id="btn-add-bot" class="btn-action btn-bot">+ БОТ 🤖</button>
                <button id="btn-start" class="btn-action btn-start">НАЧАТЬ 🃏</button>
                <button id="btn-reactions" class="btn-action btn-react">🎭</button>
            </div>

            <!-- PLAYER HAND -->
            <div class="hand-wrapper">
                <div class="player-status-line">
                    <span id="player-role-badge" class="role-badge">Вы</span>
                    <span id="player-name-badge" class="name-badge">Загрузка...</span>
                    <span id="cards-count-badge" class="cards-count-badge">0 карт</span>
                </div>
                <div id="player-hand" class="cards-fan">
                    <!-- Cards will be dynamically injected here -->
                </div>
            </div>
        </footer>

        <!-- CHAT & REACTION DRAWER -->
        <div id="chat-drawer" class="modal-drawer hidden">
            <div class="drawer-header">
                <h3>Чат и реакции стола</h3>
                <button id="btn-close-chat" class="close-btn">&times;</button>
            </div>
            <div class="quick-emojis">
                <button class="emoji-btn">😂</button>
                <button class="emoji-btn">🔥</button>
                <button class="emoji-btn">💩</button>
                <button class="emoji-btn">🤡</button>
                <button class="emoji-btn">👏</button>
                <button class="emoji-btn">🤦‍♂️</button>
                <button class="emoji-btn">💀</button>
                <button class="emoji-btn">😎</button>
            </div>
            <div class="quick-phrases">
                <button class="phrase-btn">Бито! ✋</button>
                <button class="phrase-btn">Беру... 🥲</button>
                <button class="phrase-btn">Козырей нет! 🤷‍♂️</button>
                <button class="phrase-btn">Ну ты и шулер! 🃏</button>
                <button class="phrase-btn">Ходи быстрее! ⏳</button>
            </div>
            <div id="chat-messages-list" class="chat-messages-list"></div>
            <div class="chat-input-bar">
                <input type="text" id="chat-input" placeholder="Написать реплику...">
                <button id="btn-send-chat">➤</button>
            </div>
        </div>

        <!-- SETTINGS MODAL -->
        <div id="settings-modal" class="modal-dialog hidden">
            <div class="modal-box">
                <h3>⚙️ Настройки игры и Модель Бота</h3>
                <div class="setting-item">
                    <label for="select-bot-model">Модель ИИ для бота:</label>
                    <select id="select-bot-model">
                        <option value="gemini-3.8-flash">🧠 Gemini 3.8 Flash (High)</option>
                        <option value="gemini-3.6-flash">⚡ Gemini 3.6 Flash</option>
                        <option value="groq/openai/gpt-oss-120b">🚀 Groq (GPT-OSS 120B)</option>
                        <option value="groq/qwen/qwen3.8-27b">🐲 Groq (Qwen 27B)</option>
                        <option value="gemini-3.1-pro">💎 Gemini 3.1 Pro</option>
                        <option value="classic">🏎️ Быстрый офлайн алгоритм (Classic Pro)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Ссылка для друзей:</label>
                    <div class="copy-box">
                        <input type="text" id="share-link-input" readonly>
                        <button id="btn-copy-link">Скопировать</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="btn-save-settings" class="btn-primary">Применить</button>
                    <button id="btn-close-settings" class="btn-secondary">Закрыть</button>
                </div>
            </div>
        </div>

        <!-- GAME OVER POPUP -->
        <div id="game-over-modal" class="modal-dialog hidden">
            <div class="modal-box game-over-box">
                <h2 id="game-over-title">🎉 Партия завершена!</h2>
                <div id="game-over-content" class="game-over-content"></div>
                <div class="modal-footer">
                    <button id="btn-restart-game" class="btn-primary">Сыграть ещё раз 🔄</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/durak.js?v=2"></script>
</body>
</html>
